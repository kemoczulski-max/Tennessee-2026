const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: u8(D.salt), iterations: D.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(D.iv) }, key, u8(D.ct));
  return new TextDecoder().decode(pt);
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try {
    const html = await unlock(document.getElementById("pw").value);
    document.open(); document.write(html); document.close();
  } catch (x) {
    err.textContent = "Wrong password. Try again.";
    btn.disabled = false;
  }
});
